services:
  mongo:
    image: mongo:7
    hostname: wms-mongo
    # [OPT-N1] 啟用單節點 replica set（rs0），交易一致性（multi-document
    # transaction）與 Change Streams 皆需要 replica set，standalone 不支援。
    # 單節點 rs0 提供完整交易語意，僅無跨節點容錯（等同原本 standalone 的容錯水準，
    # 不會變差）。連線字串需相應加上 ?replicaSet=rs0，見 conf/config.ini.default。
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # 用 rs.status() 探測是否已完成 initiate；未初始化前回傳非 0（unhealthy），
      # 讓 mongo-init 的 depends_on condition 正確等待，也讓其他服務不會過早連線。
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { quit(1) }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./docker/database/mongo:/data/db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  # [OPT-N1] 一次性初始化容器：呼叫 rs.initiate()。冪等（已初始化則略過，
  # 用 try/catch 吞掉 "already initialized" 錯誤），跑完即結束（無需常駐）。
  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    entrypoint: >
      bash -c "
        until mongosh --host mongo --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do
          echo 'waiting for mongod...'; sleep 2;
        done;
        mongosh --host mongo --quiet --eval '
          try {
            rs.status();
            print(\"replica set already initiated\");
          } catch (e) {
            rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]});
            print(\"replica set initiated\");
          }
        '
      "

  redis:
    image: redis:7-alpine
    hostname: wms-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "64mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - ./docker/database/redis:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 32m
